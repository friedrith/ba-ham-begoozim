name: Deploy room service

on:
  push:
    branches: [master]
    paths:
      - workers/rooms/**
      - src/features/online/**
      - src/features/game/engine/**
      - package.json
      - .github/workflows/deploy-rooms.yml

permissions:
  contents: read

concurrency: deploy-rooms

jobs:
  deploy:
    # Off until the repository has Cloudflare secrets: see workers/rooms/README.md.
    if: vars.ROOMS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run rooms:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

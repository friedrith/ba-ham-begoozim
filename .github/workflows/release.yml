name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, like 0.2.0. Empty works it out from the entries.'
        required: false

permissions:
  contents: read

concurrency: release

jobs:
  release-pr:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # RELEASE_TOKEN, not GITHUB_TOKEN: Actions can't open PRs here, and CI doesn't
      # run on PRs opened with GITHUB_TOKEN. See changelog.d/README.md.
      # Full history, because PR links come from the commits that added the entries.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Write the release
        run: bun scripts/changelog.ts "${VERSION:-auto}"
        env:
          VERSION: ${{ inputs.version }}
      - name: Open the release PR
        run: |
          version="$(jq -r .version package.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/$version"
          git add CHANGELOG.md package.json changelog.d
          git commit -m "chore: release $version"
          git push origin "release/$version"
          gh pr create --base master --title "chore: release $version" \
            --body 'Opened by the Release workflow. Merge it to publish this version in `CHANGELOG.md`.'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
